[package]
name = "leaf9000"
version = "0.0.7"
edition = "2024"
description = "The 9000 series' reader: a bare, instant comic and manga reader that reopens where you left off."
license = "MIT"

[dependencies]
# The 9000 series' shared core: the family protocol and the sisters (not
# its window: leaf9000 draws its own).
core9000 = { git = "https://github.com/solacecasino/core9000", tag = "v0.1.2", default-features = false }
# The window and input (winit); the pixels are drawn by the CPU and handed to
# the window by softbuffer, so no graphics driver is loaded.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }
softbuffer = { version = "0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
# Page decoding. Only the formats comics actually use are compiled in.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
# Shared memory with upscaler adapters (see upscale.rs).
memmap2 = "0.9.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The native menu bar (macOS and Windows).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
muda = { version = "0.21.2", default-features = false }

# macOS: books opened from Finder (Apple Events), documents imported by
# AppKit, and finding the sister apps (NSWorkspace).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace"] }

# Windows and Linux: the formats macOS reads for Leaf, read by Leaf itself.
# (The Mac build uses macOS's own; its tests build these too, so they're
# tested on every system.)
[target.'cfg(not(target_os = "macos"))'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["tiff", "tga", "ico", "pnm", "hdr", "exr"] }
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe"] }
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash", "fontconfig"] }
unrar = "0.5.8"
sevenz-rust2 = { version = "0.24.1", default-features = false }
tar = { version = "0.4.46", default-features = false }
jxl-oxide = { version = "0.12.6", default-features = false }
psd = "0.3.5"
hayro-jpeg2000 = "0.4.1"
icns = "0.5.0"
rawler = "0.8.0"
avif-decode = { version = "3.0.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Imaging", "Win32_System_Com"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["tiff", "tga", "ico", "pnm", "hdr", "exr"] }
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest", "thread_safe"] }
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash", "fontconfig"] }
unrar = "0.5.8"
sevenz-rust2 = { version = "0.24.1", default-features = false }
tar = { version = "0.4.46", default-features = false }
jxl-oxide = { version = "0.12.6", default-features = false }
psd = "0.3.5"
hayro-jpeg2000 = "0.4.1"
icns = "0.5.0"
rawler = "0.8.0"
avif-decode = { version = "3.0.0", default-features = false }

[profile.release]
strip = true
lto = true
codegen-units = 1

# Decoding in a debug build is painfully slow; optimize dependencies anyway.
[profile.dev.package."*"]
opt-level = 3
