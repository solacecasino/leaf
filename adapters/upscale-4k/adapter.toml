name = "Upscale 4K"
version = "0.1.0"
author = "Leaf"
license = "MIT"
description = "Upscales pages shown bigger than they are, on the GPU. Manga and webtoon line art is retraced and kept thin, in the spirit of Anime4K; colour comics are upscaled softly, like FSR. View → Upscale Pages (U) turns it on and off."
homepage = "https://github.com/solacecasino/leaf/tree/main/adapters/upscale-4k"

run = ["./upscale-4k"]
permissions = ["book.pages"]
filters = ["upscale"]
