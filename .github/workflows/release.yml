# Builds and tests Leaf on macOS (Apple Silicon and Intel), Windows and
# Linux, and checks that each download really opens books, RAR included.
# Pushing a tag like v0.0.3 also publishes a GitHub release with the
# downloads, using docs/releases/<tag>.md as the notes; any other push runs
# the same checks without releasing.
name: Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Install RARLAB's rar, to test real RAR files
        run: brew install --cask rar
      - name: Test
        env:
          LEAF_REQUIRE_RAR: "1"
        run: cargo test
      - name: Package
        run: scripts/package.sh
      - name: Check that the download opens every kind of book
        run: |
          set -e
          scripts/test-books.sh
          ditto -x -k dist/Leaf-*-macos-universal.zip x
          app=x/Leaf.app/Contents/MacOS/leaf
          archs=$(lipo -archs "$app"); echo "archs: $archs"
          case "$archs" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "not universal"; exit 1 ;; esac
          "$app" --version
          for f in test-books/*; do "$app" --check "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: leaf-macos
          path: dist/*
          if-no-files-found: error

  # The Intel half of the Mac download, run on an Intel Mac.
  intel:
    needs: mac
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install RARLAB's rar
        run: brew install --cask rar
      - name: Test, built for Intel
        env:
          LEAF_REQUIRE_RAR: "1"
        run: cargo test
      - uses: actions/download-artifact@v4
        with:
          name: leaf-macos
          path: dist
      - name: Check that the download's Intel half opens every kind of book
        run: |
          set -e
          uname -m
          scripts/test-books.sh
          ditto -x -k dist/Leaf-*-macos-universal.zip x
          app=x/Leaf.app/Contents/MacOS/leaf
          arch -x86_64 "$app" --version
          for f in test-books/*; do arch -x86_64 "$app" --check "$f"; done

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test
      - name: Package
        shell: pwsh
        run: |
          cargo build --release
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force stage, dist | Out-Null
          Copy-Item target\release\leaf.exe stage\Leaf.exe
          Copy-Item README.md, LICENSE stage\
          Compress-Archive -Path stage\* -DestinationPath "dist\Leaf-$v-windows-x64.zip"
      - name: Check that it opens a book, and take screenshots
        shell: pwsh
        run: |
          cargo run --quiet --release --example sample
          $p = Start-Process -FilePath stage\Leaf.exe -ArgumentList '--check', '"samples\Demo Manga.cbz"' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "--check failed: $($p.ExitCode)" }
          New-Item -ItemType Directory -Force shots, cfg | Out-Null
          $env:LEAF_CONFIG_DIR = "$PWD\cfg"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $img = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($img)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $img.Save("shots\$name.png")
          }
          $p = Start-Process -FilePath stage\Leaf.exe -ArgumentList '"samples\Demo Manga.cbz"' -PassThru
          Start-Sleep 8
          Shot "1-manga"
          $wshell = New-Object -ComObject wscript.shell
          $null = $wshell.AppActivate($p.Id)
          Start-Sleep 1
          [System.Windows.Forms.SendKeys]::SendWait("{LEFT}")
          Start-Sleep 1
          Shot "2-next-spread"
          [System.Windows.Forms.SendKeys]::SendWait("%f")
          Start-Sleep 1
          Shot "3-file-menu"
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v4
        with:
          name: leaf-windows
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-windows
          path: shots/

  linux:
    runs-on: ubuntu-22.04   # an older glibc, so it runs on more distros
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencies (libarchive is found at run time, for RAR, 7-Zip and TAR)
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive13 libarchive-tools xvfb xdotool imagemagick openbox
      - name: Test
        run: cargo test
      - name: Package
        run: |
          set -e
          cargo build --release
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          d=leaf-$v-linux-x64
          mkdir -p "stage/$d" dist
          cp target/release/leaf README.md LICENSE "stage/$d/"
          tar -czf "dist/$d.tar.gz" -C stage "$d"
      - name: Check that it opens every kind of book it reads here
        run: |
          set -e
          scripts/test-books.sh
          ./target/release/leaf --version
          for f in test-books/*.cb*; do ./target/release/leaf --check "$f"; done
      - name: Screenshots
        run: |
          mkdir -p shots cfg
          export LEAF_CONFIG_DIR=$PWD/cfg DISPLAY=:99
          Xvfb :99 -screen 0 1280x1000x24 &
          sleep 2
          openbox &
          sleep 1
          ./target/release/leaf "samples/Demo Webtoon.cbz" &
          sleep 6
          W=$(xdotool search --sync --name Leaf | head -1)
          xdotool windowactivate --sync "$W" || true
          import -window root shots/1-webtoon.png
          xdotool key space; sleep 1
          import -window root shots/2-scrolled.png
      - uses: actions/upload-artifact@v4
        with:
          name: leaf-linux
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-linux
          path: shots/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, intel, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: leaf-*
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="docs/releases/${tag}.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$tag" dist/* --title "Leaf ${tag#v}" "$@"
