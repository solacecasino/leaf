# Builds and tests Leaf on every system it runs on: macOS (Apple Silicon and
# Intel), Windows (x64 and Arm) and Linux (x64 and Arm). Each download is
# checked by opening a book in every format with it, and the adapters in
# adapters/ are built and self-tested on each machine's GPU. Pushing a tag
# like v0.0.4 also publishes a GitHub release with everything, using
# docs/releases/<tag>.md as the notes; any other push runs the same checks
# without releasing.
name: Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # pdfium (Windows and Linux draw PDFs with it), from pdfium-binaries.
  PDFIUM_TAG: chromium/8076

jobs:
  # A real RAR book, made with RARLAB's rar (Ubuntu packages it; Homebrew
  # dropped it in 2026).
  rar-book:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update && sudo apt-get install -y rar nasm
          cargo run --quiet --release --example sample
          mkdir -p pages && (cd pages && unzip -q "../samples/Demo Manga.cbz")
          (cd pages && rar a -r -idq ../manga.cbr .)
      - uses: actions/upload-artifact@v4
        with:
          name: rar-book
          path: manga.cbr
          if-no-files-found: error

  # A book in every format, made on a Mac (textutil and cupsfilter write the
  # documents), with the RAR added.
  books:
    needs: rar-book
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/test-books.sh
      - uses: actions/download-artifact@v4
        with:
          name: rar-book
          path: test-books
      - uses: actions/upload-artifact@v4
        with:
          name: test-books
          path: test-books
          if-no-files-found: error

  mac:
    needs: books
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: pdfium, to test the Windows and Linux PDF code here too
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pdfium && cd pdfium
          gh release download "$PDFIUM_TAG" --repo bblanchon/pdfium-binaries -p pdfium-mac-arm64.tgz
          tar xzf pdfium-mac-arm64.tgz
      - name: Test
        env:
          LEAF_REQUIRE_PDFIUM: "1"
        run: LEAF_PDFIUM=$PWD/pdfium/lib/libpdfium.dylib cargo test
      - name: Package Leaf and the adapters
        run: |
          scripts/package.sh
          scripts/package-adapter.sh upscale-4k
      - uses: actions/download-artifact@v4
        with:
          name: test-books
          path: test-books
      - name: Check that each download opens every kind of book
        run: |
          set -e
          for zip in dist/Leaf-*-macos-*.zip; do
            rm -rf x && ditto -x -k "$zip" x
            app=x/Leaf.app/Contents/MacOS/leaf
            echo "== $zip: $(lipo -archs "$app")"
            case "$zip" in *universal*) lipo -archs "$app" | grep -q x86_64 && lipo -archs "$app" | grep -q arm64 ;; esac
            "$app" --version
            case "$zip" in *x64*) continue ;; esac
            for f in test-books/*; do "$app" --check "$f"; done
          done
      - name: Self-test the upscaler on this GPU
        run: |
          rm -rf a && mkdir a && cd a && unzip -q ../dist/upscale-4k-*-macos-universal.zip
          ./upscale-4k/upscale-4k --selftest
          ./upscale-4k/upscale-4k --bench
          # A real GPU is offered to Leaf.
          printf '{"id":1,"method":"upscale.ready"}\n' | ./upscale-4k/upscale-4k | tee ready.json
          grep -q '"device"' ready.json
      - name: Install the adapter's zip as a drop on Leaf does, and run it
        run: LEAF_ADAPTER_ZIP=$(echo $PWD/dist/upscale-4k-*-macos-universal.zip) cargo test installs_and_runs_a_released_zip -- --nocapture
      - uses: actions/upload-artifact@v4
        with:
          name: leaf-macos
          path: dist/*
          if-no-files-found: error

  # The Intel Mac downloads, on an Intel Mac.
  intel:
    needs: mac
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test, built for Intel
        run: |
          brew install nasm
          cargo test
      - uses: actions/download-artifact@v4
        with:
          name: leaf-macos
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: test-books
          path: test-books
      - name: Check that the Intel and universal downloads open every kind of book
        run: |
          set -e
          uname -m
          for zip in dist/Leaf-*-macos-x64.zip dist/Leaf-*-macos-universal.zip; do
            rm -rf x && ditto -x -k "$zip" x
            echo "== $zip"
            for f in test-books/*; do arch -x86_64 x/Leaf.app/Contents/MacOS/leaf --check "$f"; done
          done
      - name: Self-test the upscaler on this GPU
        run: |
          rm -rf a && mkdir a && cd a && unzip -q ../dist/upscale-4k-*-macos-universal.zip
          arch -x86_64 ./upscale-4k/upscale-4k --selftest

  windows:
    needs: books
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, arch: x64 }
          - { os: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The AVIF decoder's x86 assembly.
      - uses: ilammy/setup-nasm@v1
        if: matrix.arch == 'x64'
      - name: pdfium
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pdfium && cd pdfium
          gh release download "$PDFIUM_TAG" --repo bblanchon/pdfium-binaries -p "pdfium-win-${{ matrix.arch }}.tgz"
          tar xzf "pdfium-win-${{ matrix.arch }}.tgz"
      - name: Test
        shell: bash
        env:
          LEAF_REQUIRE_PDFIUM: "1"
        run: LEAF_PDFIUM="$PWD/pdfium/bin/pdfium.dll" cargo test
      - name: Package Leaf and the adapters
        shell: bash
        run: |
          PDFIUM_DIR="$PWD/pdfium" scripts/package.sh
          scripts/package-adapter.sh upscale-4k
          # Every file named for this machine, or the release would mix them up.
          ls dist
          for f in dist/*; do case "$f" in *-${{ matrix.arch }}.*) ;; *) echo "::error::$f isn't named ${{ matrix.arch }}"; exit 1 ;; esac; done
      - uses: actions/download-artifact@v4
        with:
          name: test-books
          path: test-books
      - name: Check that the download opens every kind of book
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force x | Out-Null
          Expand-Archive -Force (Get-ChildItem dist\Leaf-*-windows-*.zip).FullName x
          foreach ($f in Get-ChildItem test-books) {
            $p = Start-Process -FilePath x\Leaf.exe -ArgumentList '--check', ('"' + $f.FullName + '"') -Wait -PassThru -NoNewWindow
            if ($p.ExitCode -ne 0) { throw "--check failed on $($f.Name): $($p.ExitCode)" }
            Write-Output "ok $($f.Name)"
          }
      - name: Add Leaf to Open with, as install.cmd does
        shell: pwsh
        run: |
          $c = "HKCU:\Software\Classes"
          function Default($k) { if (Test-Path -LiteralPath $k) { [string](Get-Item -LiteralPath $k).GetValue("") } else { "" } }
          # Another app already opens .cbr: Leaf must leave it alone.
          New-Item -Path "$c\.cbr" -Force | Out-Null
          Set-Item -LiteralPath "$c\.cbr" -Value "Other.Comic"
          cmd /c "x\install.cmd < NUL"
          if ($LASTEXITCODE -ne 0) { throw "install.cmd failed: $LASTEXITCODE" }
          $exe = (Resolve-Path x\Leaf.exe).Path
          $want = '"' + $exe + '" "%1"'
          foreach ($k in "Leaf.Comic", "Leaf.Book", "Applications\Leaf.exe", "Directory\shell\Leaf") {
            $got = Default "$c\$k\shell\open\command"
            if ($k -like "Directory*") { $got = Default "$c\$k\command" }
            if ($got -ne $want) { throw "$k opens with [$got], not [$want]" }
          }
          if (-not (Test-Path (Join-Path (Split-Path $exe) leaf.ico))) { throw "leaf.ico is missing" }
          foreach ($e in ".cbz", ".cb7", ".cbt") { if ((Default "$c\$e") -ne "Leaf.Comic") { throw "$e doesn't open in Leaf" } }
          if ((Default "$c\.cbr") -ne "Other.Comic") { throw ".cbr was taken from the app that had it" }
          foreach ($e in ".cbr", ".pdf", ".epub") {
            $names = (Get-Item -LiteralPath "$c\$e\OpenWithProgids").GetValueNames()
            if (-not ($names -contains "Leaf.Comic" -or $names -contains "Leaf.Book")) { throw "Leaf isn't in $e's Open with list" }
          }
          if ((Default "$c\.pdf") -eq "Leaf.Book") { throw ".pdf was made Leaf's" }
          # Opening a .cbz the way a double-click does: Leaf starts with it.
          $cmd = (Default "$c\Leaf.Comic\shell\open\command").Replace("%1", (Resolve-Path test-books\manga.cbz).Path)
          $p = Start-Process cmd -ArgumentList "/c", "`"$cmd`"" -PassThru
          Start-Sleep 5
          $leaf = Get-Process Leaf -ErrorAction SilentlyContinue
          if (-not $leaf) { throw "Leaf didn't start from the Open command" }
          $leaf | Stop-Process
          cmd /c "x\install.cmd --remove < NUL"
          foreach ($k in "Leaf.Comic", "Leaf.Book", "Applications\Leaf.exe", "Directory\shell\Leaf") { if (Test-Path "$c\$k") { throw "$k is still there after --remove" } }
          if ((Default "$c\.cbz") -ne "") { throw ".cbz still opens in Leaf after --remove" }
          if ((Default "$c\.cbr") -ne "Other.Comic") { throw "--remove changed .cbr" }
          Write-Output "install.cmd and --remove ok"
      - name: Self-test the upscaler on this GPU (WARP, the software one, on a runner)
        shell: bash
        run: |
          rm -rf a && mkdir a && cd a && unzip -q ../dist/upscale-4k-*-windows-*.zip
          ./upscale-4k/upscale-4k.exe --selftest
          # No --bench: a software GPU's times say nothing about a real one.
          # The software GPU is turned down, so Leaf scales by itself.
          printf '{"id":1,"method":"upscale.ready"}\n' | ./upscale-4k/upscale-4k.exe | tee ready.json
          grep -q 'drawn by the CPU' ready.json
      - name: Install the adapter's zip as a drop on Leaf does, and run it
        shell: bash
        run: LEAF_ADAPTER_ZIP=$(echo $PWD/dist/upscale-4k-*-windows-*.zip) cargo test installs_and_runs_a_released_zip -- --nocapture
      - name: Screenshots
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots, cfg | Out-Null
          $env:LEAF_CONFIG_DIR = "$PWD\cfg"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $img = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($img)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $img.Save("shots\$name.png")
          }
          foreach ($book in "manga.cbr", "novel.docx", "page.pdf") {
            $p = Start-Process -FilePath x\Leaf.exe -ArgumentList ('"' + (Resolve-Path "test-books\$book") + '"') -PassThru
            Start-Sleep 6
            Shot $book
            Stop-Process -Id $p.Id
          }
      - uses: actions/upload-artifact@v4
        with:
          name: leaf-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && matrix.arch == 'x64'
        with:
          name: screenshots-windows
          path: shots/

  linux:
    needs: books
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, arch: x64 }
          - { os: ubuntu-22.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}   # an older glibc, so it runs on more distros
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencies
        run: |
          sudo apt-get update
          # libarchive and libheif are found at run time; lavapipe is a
          # software Vulkan GPU for the upscaler's self-test.
          sudo apt-get install -y libarchive13 libarchive-tools libheif1 libxkbcommon-x11-0 mesa-vulkan-drivers \
            xvfb xdotool imagemagick openbox
          if [ "${{ matrix.arch }}" = x64 ]; then sudo apt-get install -y nasm rar; fi
      - name: pdfium
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pdfium && cd pdfium
          gh release download "$PDFIUM_TAG" --repo bblanchon/pdfium-binaries -p "pdfium-linux-${{ matrix.arch }}.tgz"
          tar xzf "pdfium-linux-${{ matrix.arch }}.tgz"
      - name: Test
        env:
          LEAF_REQUIRE_PDFIUM: "1"
        run: |
          if [ "${{ matrix.arch }}" = x64 ]; then export LEAF_REQUIRE_RAR=1; fi
          LEAF_PDFIUM=$PWD/pdfium/lib/libpdfium.so cargo test
      - name: Package Leaf and the adapters
        run: |
          PDFIUM_DIR=$PWD/pdfium scripts/package.sh
          scripts/package-adapter.sh upscale-4k
          # Every file named for this machine, or the release would mix them up.
          ls dist
          for f in dist/*; do case "$f" in *-${{ matrix.arch }}.*) ;; *) echo "::error::$f isn't named ${{ matrix.arch }}"; exit 1 ;; esac; done
      - uses: actions/download-artifact@v4
        with:
          name: test-books
          path: test-books
      - name: Check that the download opens every kind of book
        run: |
          set -e
          mkdir -p x && tar xzf dist/leaf-*-linux-*.tar.gz -C x
          leaf=$(echo x/leaf-*/leaf)
          "$leaf" --version
          for f in test-books/*; do "$leaf" --check "$f"; done
      - name: Add Leaf to the app menu, as install.sh does for people
        run: |
          set -e
          sudo apt-get install -y desktop-file-utils xdg-utils
          export HOME=$PWD/home XDG_DATA_HOME=$PWD/home/.local/share
          mkdir -p "$HOME"
          # A comic type that already has an app keeps it.
          mkdir -p "$XDG_DATA_HOME/applications"
          printf '[Desktop Entry]\nType=Application\nName=Other\nExec=true %%f\n' > "$XDG_DATA_HOME/applications/other.desktop"
          xdg-mime default other.desktop application/x-cbt
          x/leaf-*/install.sh
          desktop-file-validate "$XDG_DATA_HOME/applications/leaf.desktop"
          cat "$XDG_DATA_HOME/applications/leaf.desktop"
          test -f "$XDG_DATA_HOME/icons/hicolor/256x256/apps/leaf.png"
          test "$(xdg-mime query default application/vnd.comicbook+zip)" = leaf.desktop
          test "$(xdg-mime query default application/vnd.comicbook-rar)" = leaf.desktop
          test "$(xdg-mime query default application/x-cbt)" = other.desktop
          # The Exec line really starts this Leaf.
          exe=$(sed -n 's/^Exec="\(.*\)" %f$/\1/p' "$XDG_DATA_HOME/applications/leaf.desktop")
          "$exe" --version
          x/leaf-*/install.sh --remove
          test ! -e "$XDG_DATA_HOME/applications/leaf.desktop"
      - name: Self-test the upscaler on this GPU (lavapipe, the software one, on a runner)
        run: |
          rm -rf a && mkdir a && cd a && unzip -q ../dist/upscale-4k-*-linux-*.zip
          ./upscale-4k/upscale-4k --selftest
          # No --bench: a software GPU's times say nothing about a real one.
          # The software GPU is turned down, so Leaf scales by itself.
          printf '{"id":1,"method":"upscale.ready"}\n' | ./upscale-4k/upscale-4k | tee ready.json
          grep -q 'drawn by the CPU' ready.json
      - name: Install the adapter's zip as a drop on Leaf does, and run it
        run: LEAF_ADAPTER_ZIP=$(echo $PWD/dist/upscale-4k-*-linux-*.zip) cargo test installs_and_runs_a_released_zip -- --nocapture
      - name: Screenshots
        if: matrix.arch == 'x64'
        timeout-minutes: 3
        run: |
          mkdir -p shots cfg
          export LEAF_CONFIG_DIR=$PWD/cfg DISPLAY=:99
          Xvfb :99 -screen 0 1280x1000x24 &
          sleep 2
          openbox &
          sleep 1
          leaf=$(echo x/leaf-*/leaf)
          for book in manga.cb7 novel.odt page.pdf; do
            "$leaf" "test-books/$book" &
            pid=$!
            sleep 5
            import -window root "shots/$book.png"
            kill $pid
          done
      - uses: actions/upload-artifact@v4
        with:
          name: leaf-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && matrix.arch == 'x64'
        with:
          name: screenshots-linux
          path: shots/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, intel, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: leaf-*
      - name: Gather, refusing two files with the same name
        run: |
          mkdir out
          for f in dist/*/*; do
            [ -e "out/${f##*/}" ] && { echo "::error::two builds made ${f##*/}"; exit 1; }
            mv "$f" out/
          done
          ls -l out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="docs/releases/${tag}.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$tag" out/* --title "Leaf ${tag#v}" "$@"
